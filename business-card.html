<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Business Card</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .profile-card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 20px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    h1 { font-size: 24px; margin: 0 0 5px; }
    p.title { color: var(--subtext); margin: 0 0 20px; font-size: 14px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      background-color: #334155;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #475569; }
    .btn-primary {
      background-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background-color: #2563eb; }
  </style>
</head>
<body>

<div class="profile-card">
  <div class="avatar">JD</div>
  <h1>John Doe</h1>
  <p class="title">Embedded Systems Developer</p>

  <a href="javascript:void(0)" onclick="downloadVCard()" class="btn btn-primary">
    📥 Save Contact to Phone
  </a>
  <a href="tel:+1234567890" class="btn">📞 Call Me</a>
  <a href="mailto:john@example.com" class="btn">✉️ Email Me</a>
  <a href="https://linkedin.com" target="_blank" class="btn">🌐 LinkedIn Profile</a>
</div>

<script>
function downloadVCard() {
  const vcardData = 
`BEGIN:VCARD
VERSION:3.0
FN:John Doe
TITLE:Embedded Systems Developer
TEL;TYPE=CELL:+1234567890
EMAIL:john@example.com
URL:https://linkedin.com
END:VCARD`;

  const blob = new Blob([vcardData], { type: 'text/vcard' });
  const url = window.URL.createObjectURL(blob);
  const newLink = document.createElement('a');
  newLink.download = 'John_Doe.vcf';
  newLink.href = url;
  newLink.click();
}
</script>

</body>
</html>
